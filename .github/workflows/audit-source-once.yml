name: One-time upstream source identity audit
on:
  push:
    paths:
      - '.github/workflows/audit-source-once.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            .github
            .trillionai
            docs
            TRILLIONAI_REFERENCE.md
      - name: Compare exact upstream object IDs without executing code
        shell: bash
        env:
          UPSTREAM_SHA: 1f3e4023af4bdd919be38e552b9494f6b10eb73f
          UPSTREAM_URL: https://github.com/dyad-sh/dyad.git
        run: |
          set -euo pipefail
          git init -q /tmp/audit-upstream
          git -C /tmp/audit-upstream remote add origin "$UPSTREAM_URL"
          git -C /tmp/audit-upstream -c protocol.version=2 fetch -q --depth 1 --filter=blob:none origin "$UPSTREAM_SHA"
          test "$(git -C /tmp/audit-upstream rev-parse FETCH_HEAD)" = "$UPSTREAM_SHA"
          python3 - <<'PY'
          import os,subprocess,json
          from pathlib import Path
          def tree(d,ref):
              b=subprocess.check_output(["git","-C",d,"ls-tree","-rz",ref]);result={}
              for e in b.split(b"\0"):
                  if not e: continue
                  head,path=e.split(b"\t",1)
                  mode,kind,sha=head.decode().split()
                  result[path.decode("utf-8","surrogateescape")]={"mode":mode,"type":kind,"sha":sha}
              return result
          up=tree("/tmp/audit-upstream","FETCH_HEAD")
          dest=tree(".","HEAD")
          missing=sorted(set(up)-set(dest));common=set(up)&set(dest)
          changed=sorted(p for p in common if up[p]!=dest[p])
          excluded_ci=[p for p in missing if p.startswith(".github/workflows/")]
          doc={"upstream":os.environ["UPSTREAM_URL"],"pinned_commit":os.environ["UPSTREAM_SHA"],"audited_main_commit":subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(),"upstream_git_entries":len(up),"destination_git_entries":len(dest),"missing_count":len(missing),"missing_ci_workflow_count":len(excluded_ci),"missing_non_ci_count":len(missing)-len(excluded_ci),"content_or_mode_mismatch_count":len(changed),"extra_count":len(set(dest)-set(up)),"missing_paths":missing,"mismatched_objects":[{"path":p,"upstream":up[p],"destination":dest[p]} for p in changed],"extra_paths":sorted(set(dest)-set(up))}
          d=Path("docs/verified-source-audit");d.mkdir(parents=True,exist_ok=True)
          (d/"dyad-main-delta.json").write_text(json.dumps(doc,indent=2)+"\n",encoding="utf-8")
          (d/"dyad-summary.md").write_text("# dyad pinned upstream versus current main\n\n- Upstream revision: `"+os.environ["UPSTREAM_SHA"]+"`\n- Original tracked entries: **"+str(len(up))+"**\n- Missing: **"+str(len(missing))+"** (CI workflows: **"+str(len(excluded_ci))+"**; other: **"+str(len(missing)-len(excluded_ci))+"**)\n- Git SHA/mode mismatches: **"+str(len(changed))+"**\n- Extra TrillionAI entries: **"+str(len(doc["extra_paths"]))+"**\n\nSee JSON for exact path and hash differences. Git-tree comparison only; external submodules, Git LFS payloads, full history and private services are outside scope.\n")
          print(json.dumps({k:v for k,v in doc.items() if not isinstance(v,list)},indent=2))
          PY
          rm .github/workflows/audit-source-once.yml
          git add -A
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "audit: compare dyad main against pinned upstream Git objects"
          git push origin HEAD:main
