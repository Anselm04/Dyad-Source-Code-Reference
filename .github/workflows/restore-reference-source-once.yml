name: Restore original Dyad reference source once
on:
  push:
    paths:
      - '.github/workflows/restore-reference-source-once.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Restore complete original Dyad pro path
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=48b4a29d2937ccdfbf63c57bc24ee7c18b26a802
          git cat-file -e "${SOURCE}^{commit}"
          git restore --source="$SOURCE" --staged --worktree -- src/pro
          before="$(git ls-tree -r --name-only "$SOURCE" -- src/pro | wc -l | tr -d ' ')"
          after="$(git ls-files -- src/pro | wc -l | tr -d ' ')"
          test "$before" -eq "$after"
          test -f LICENSE
          test -f src/pro/LICENSE
          mkdir -p .trillionai
          {
            echo '# Dyad source restoration verification'
            echo
            echo "Pre-cleanup commit: $SOURCE"
            echo "Original separately licensed path tracked files: $before"
            echo "Restored separately licensed path tracked files: $after"
            echo "Original licences and attribution preserved."
            echo "No upstream application code executed."
            echo "Reference archive; downstream distribution and reuse require licence compliance."
          } > .trillionai/SOURCE_RESTORATION.md
          rm .github/workflows/restore-reference-source-once.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'restore(reference): reinstate complete Dyad original source tree'
          git push origin HEAD:main
